<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4FD"/>
      <stop offset="1" stop-color="#ECE6F8"/>
    </linearGradient>
    <linearGradient id="sakura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B8D0"/>
      <stop offset="1" stop-color="#EF7FA8"/>
    </linearGradient>
    <path id="petal" d="M0,-4 C-7,-7 -11,-15 -7.5,-21 C-5,-25 -2,-24.5 0,-20.5 C2,-24.5 5,-25 7.5,-21 C11,-15 7,-7 0,-4 Z"/>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- мягкие пятна в палитре -->
  <circle cx="110" cy="540" r="230" fill="#EF7FA8" opacity="0.10"/>
  <circle cx="1110" cy="100" r="250" fill="#8E7CC3" opacity="0.10"/>

  <!-- крупный полупрозрачный иероглиф 道 («путь») -->
  <text x="1150" y="600" text-anchor="end" font-size="420" opacity="0.07" fill="#8E7CC3"
        font-family="'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">道</text>

  <!-- логотип-сакура -->
  <g transform="translate(265,300) scale(5.6)" fill="url(#sakura)">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
  </g>
  <circle cx="265" cy="300" r="19" fill="#F8CD6F"/>

  <!-- текст -->
  <text x="448" y="305" font-size="118" font-weight="700" fill="#2E2746" letter-spacing="3">MICHI</text>
  <text x="452" y="372" font-size="33" fill="#6B6480">Японский с нуля — и в удовольствие</text>
  <text x="452" y="452" font-size="36" fill="#8E7CC3" font-weight="500"
        font-family="'Noto Sans JP','Yu Gothic','Meiryo',sans-serif">ひらがな・カタカナ・漢字・文法&#160;N5</text>
</svg>
