# Fly.io — деплой MICHI. Подробности и переменные см. README → «Деплой».
#
# ВАЖНО: прогресс пользователей — это per-user SQLite на томе michi_data,
# привязанном к ОДНОЙ машине. Держите ровно одну машину:
#   fly scale count 1
# Масштабирование до 2+ инстансов разорвёт данные между машинами.
#
# Перед первым деплоем поменяйте app на своё (имя уникально на весь Fly).

app = "michi-nihongo"          # адрес сайта: https://michi-nihongo.fly.dev
primary_region = "fra"          # Франкфурт; смените при желании (fly platform regions)

[build]
  # Используется корневой Dockerfile проекта.

[env]
  MICHI_COOKIE_SECURE = "1"     # cookie только по HTTPS (за TLS Fly — обязательно)
  # Живой синтез выключен (Edge TTS троттлит под нагрузкой), но нейроголос у
  # посетителей ЕСТЬ: /api/tts раздаёт прегенерированную озвучку курса из
  # tts_baked/ (собирается scripts/build_tts.py и коммитится в репозиторий).
  MICHI_TTS_ENABLED = "0"

  # ВАЖНО: задайте постоянный секрет подписи cookie ДО первого деплоя —
  #   fly secrets set MICHI_SECRET_KEY=$(openssl rand -hex 32)
  # Без него ключ генерируется на томе (пропадёт с томом → все разлогинятся);
  # сервер пишет об этом WARNING при старте. MICHI_AI_* и ключи провайдеров ИИ —
  # тоже через `fly secrets set` (по желанию).
  #
  # Бэкапы: суточные архивы прогресса пишутся на этот же том (data/backups) и
  # потерю тома НЕ переживут — задайте offsite-выгрузку в S3-совместимое
  # хранилище (Cloudflare R2 бесплатен до 10 ГБ; см. app/backup.py):
  #   fly secrets set MICHI_BACKUP_S3_ENDPOINT=... MICHI_BACKUP_S3_BUCKET=... \
  #     MICHI_BACKUP_S3_ACCESS_KEY=... MICHI_BACKUP_S3_SECRET_KEY=...

[http_service]
  internal_port = 8000
  force_https = true            # http → https редирект
  auto_stop_machines = "stop"   # гасить простаивающую машину (данные на томе целы)
  auto_start_machines = true    # будить на входящий запрос
  min_machines_running = 0      # 0 = «спит» без трафика (экономно); 1 = всегда онлайн

[mounts]
  source = "michi_data"         # имя тома (создаётся: fly volumes create michi_data)
  destination = "/app/data"     # сюда пишутся секрет cookie и базы пользователей

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # хватает с запасом; 256mb тоже работает (дешевле)
